<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self';">
  <title>Urbano Norte</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="barra">
    <span class="marca" aria-hidden="true"><span class="ponto"></span>Urbano Norte</span>
    <nav role="tablist" aria-label="Sistemas">
      <button type="button" role="tab" id="aba-sorteio" data-aba="sorteio" aria-selected="true" title="Sorteio (Ctrl+1)">Sorteio</button>
      <button type="button" role="tab" id="aba-disparo" data-aba="disparo" aria-selected="false" title="Disparo de mensagens (Ctrl+2)">Disparo <span class="beta">beta</span></button>
      <button type="button" role="tab" id="aba-atendimento" data-aba="atendimento" aria-selected="false" title="Atendimento pelo WhatsApp (Ctrl+3)">Atendimento <span class="beta">beta</span><span id="contador-atendimento" class="contador oculto" aria-live="polite"></span></button>
    </nav>
    <span id="versao" class="versao"></span>
  </header>
  <script src="shell.js"></script>
</body>
</html>
