name: App unificado (desktop) - gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  build:
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Testes do servidor do Atendimento
        run: node --test test/servidor.test.mjs
        working-directory: atendimento/servidor
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir assinatura do app (Mac)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: urbano-norte-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg

  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Urbano Norte - instaladores (build ${{ github.run_number }})
          draft: true
          files: |
            instaladores/*.exe
            instaladores/*.dmg
