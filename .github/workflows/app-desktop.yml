name: App unificado (desktop) - gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  build:
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Conferir se a tag bate com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          versao="$(node -p "require('./package.json').version")"
          if [ "app-v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $versao do app/package.json. Mude a versão e crie a tag app-v$versao."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Testes do servidor do Atendimento
        run: node --test test/servidor.test.mjs
        working-directory: atendimento/servidor
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir assinatura do app (Mac)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: urbano-norte-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/latest.yml
            app/dist/*.dmg

  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      # Rodada manual (sem tag): só um rascunho para baixar e testar.
      - name: Rascunho (rodada manual)
        if: "!startsWith(github.ref, 'refs/tags/app-v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Urbano Norte - instaladores (build ${{ github.run_number }})
          draft: true
          files: |
            instaladores/*.exe
            instaladores/*.dmg
      # Tag app-vX.Y.Z: versão oficial, com os instaladores para baixar...
      - name: Versão oficial
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Urbano Norte ${{ github.ref_name }}
          make_latest: false
          files: |
            instaladores/*.exe
            instaladores/*.dmg
      # ...e o endereço fixo que os apps instalados no Windows consultam para se atualizar (atualizacao.js).
      - name: Endereço de atualização (app-latest)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Urbano Norte - atualização automática (não apagar)
          body: Arquivos que os apps instalados no Windows consultam para se atualizar sozinhos. Trocados a cada versão app-v*. Não apague esta release.
          make_latest: false
          files: |
            instaladores/latest.yml
            instaladores/Urbano-Norte-Instalador-*.exe
            instaladores/Urbano-Norte-Instalador-*.exe.blockmap
